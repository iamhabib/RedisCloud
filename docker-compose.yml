services:
  redis:
    image: redis:${REDIS_VERSION}
    container_name: ${ENV}_${APP_NAME}_redis
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      mynet: {}
    mem_limit: ${MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mynet:
    driver: bridge
    name: ${ENV}_${APP_NAME}_network
